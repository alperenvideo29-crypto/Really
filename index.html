<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LGS Matematik | Soru ve Çözüm Platformu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 1) Giriş ve rol seçimi -->
<section id="loginView" class="login">
  <div class="login-card">
    <div class="logo">∑</div>
    <h1>LGS Matematik</h1>
    <p class="lead">8. sınıf soru ve çözüm platformu</p>
    <div class="roles" id="roleBox">
      <button type="button" class="role active" data-role="Öğrenci">🎓 Öğrenci</button>
      <button type="button" class="role" data-role="Öğretmen">👩‍🏫 Öğretmen</button>
    </div>
    <form id="loginForm" novalidate>
      <h3 id="formTitle">Öğrenci bilgileri</h3>
      <label>Ad<input id="firstName" autocomplete="given-name" placeholder="Adın"></label>
      <label>Soyad<input id="lastName" autocomplete="family-name" placeholder="Soyadın"></label>
      <p class="error" id="loginError" hidden></p>
      <button class="btn primary" type="submit">Platforma gir</button>
    </form>
  </div>
</section>

<!-- 2) Ana panel -->
<div id="appView" hidden>
  <header class="topbar">
    <div class="brand"><span>∑</span>LGS Matematik</div>
    <div class="user">
      <span id="userName"></span><b id="userRole" class="badge"></b>
      <button id="logoutBtn" class="btn ghost sm" type="button">Çıkış yap</button>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <h2>Yeni soru ekle</h2>
      <form id="questionForm">
        <div class="grid">
          <label>Konu başlığı<select id="qTopic" required></select></label>
          <label>Soru dosyası (JPG, PNG veya PDF)<input type="file" id="qFile" accept=".jpg,.jpeg,.png,application/pdf"></label>
        </div>
        <label>Soru metni veya açıklama<textarea id="qText" rows="3" placeholder="Soruyu yaz ya da neyi çözemediğini kısaca anlat"></textarea></label>
        <div id="qPreview" class="preview"></div>
        <button class="btn primary" type="submit">Soruyu yayınla</button>
      </form>
    </section>

    <section>
      <div class="list-head">
        <h2>Sorular <span id="count">0</span></h2>
        <select id="filterTopic" aria-label="Konuya göre filtrele"></select>
      </div>
      <div id="questionList" class="cards"></div>
    </section>
  </main>
</div>

<div id="lightbox" class="lightbox" hidden><img alt="Büyütülmüş görsel"></div>
<div id="toast" class="toast" role="status"></div>

<script src="script.js"></script>
</body>
</html>
