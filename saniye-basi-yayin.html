<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Saniye Başı Yayın</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:#050309;color:#eee;font-family:system-ui,Segoe UI,Arial,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#st{position:relative;width:min(98vw,1100px)}
canvas{width:100%;height:auto;display:block;border-radius:10px;background:#000;cursor:pointer}
#sub{position:absolute;left:4%;right:4%;bottom:4%;text-align:center;font-weight:700;font-size:clamp(12px,2.2vw,22px);color:#fff;text-shadow:0 0 6px #000,0 0 3px #000}
#ctl{display:flex;gap:10px;align-items:center;width:min(98vw,1100px);font-size:14px}
button{background:#7a3cff;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
input[type=range]{flex:1}
</style></head><body>
<div id="st"><canvas id="c" width="1280" height="720"></canvas><div id="sub"></div></div>
<div id="ctl"><button id="b">▶ Başlat</button><input id="r" type="range" min="0" max="60" step="0.1" value="0"><span id="tm">0:00 / 1:00</span><label><input id="m" type="checkbox"> Sessiz</label></div>
<script>
const c=document.getElementById("c"),g=c.getContext("2d"),W=1280,H=720;
const R=i=>{const x=Math.sin(i*127.1+311.7)*43758.5;return x-Math.floor(x)};
let t=0,playing=false,last=0,lc=-1;
const cues=[[0.5,9.5,"Tik-tak... Tik-tak... Unutun o eski günleri. Yaşadığımız bu evrende artık zaman saatlerle değil... kurulan televizyon kanallarıyla ölçülüyor!"],
[10,15,"Çünkü bu dünyada... her saniye bir televizyon kanalı kuruluyor!"],
[15.5,25.5,"Artık ‘ne izlesem?’ sorusu tarihe gömüldü. Sokakta yürümek mi? Her adımınız, her nefesiniz anında yeni bir kanalın ilk bölümü."],
[26,34.5,"İnsanlar birbirleriyle konuşmuyor artık. ‘Ben şu an 14 bin 203 numaralı kanaldayım, beni oradan izle’ diyorlar."],
[37,49.5,"Ve günün birinde... tam saat 14:12’de, sadece hiçbir şey yayınlamayan ve ekrana bakıp ağlayan bir adamın kanalı açılıyor. Üç milyar insan... kendi yalnızlığını o ekranda buluyor."],
[51,56,"Hayat artık sonsuz bir kanal sörfü... Kimse ne izlediğini bilmiyor."],
[57.5,60,"...Ama kimse kumandayı elinden bırakmıyor."]];
function say(s){if(m.checked||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang="tr-TR";u.rate=1.1;const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith("tr"));if(v)u.voice=v;speechSynthesis.speak(u)}
const rr=(x,y,w,h,r)=>{g.beginPath();g.roundRect(x,y,w,h,r)};
const ci=(x,y,r,f)=>{g.fillStyle=f;g.beginPath();g.arc(x,y,r,0,7);g.fill()};
const T=(s,x,y,z,col="#fff",al="center",sh)=>{g.font=`800 ${z}px system-ui,Arial,sans-serif`;g.textAlign=al;g.fillStyle=col;if(sh){g.shadowColor=sh;g.shadowBlur=24}g.fillText(s,x,y);g.shadowBlur=0};
function tv(x,y,s,h,t){g.save();g.translate(x,y);g.scale(s,s);g.strokeStyle="#ddd";g.lineWidth=3;g.beginPath();g.moveTo(0,-30);g.lineTo(-14,-52);g.moveTo(0,-30);g.lineTo(14,-52);g.stroke();g.fillStyle="#222";rr(-40,-32,80,60,10);g.fill();g.fillStyle=`hsl(${h},90%,${50+18*Math.sin(t*6+h)}%)`;rr(-33,-25,66,42,6);g.fill();T("TV",0,2,16,"#fff");g.restore()}
function bg(t){g.fillStyle="#0a0618";g.fillRect(0,0,W,H);g.lineWidth=40;for(let i=0;i<5;i++){g.strokeStyle=i%2?"rgba(60,255,150,.35)":"rgba(170,70,255,.4)";g.beginPath();for(let x=0;x<=W;x+=40){const y=120+i*55+Math.sin(x/200+t*1.2+i)*40;x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}}
function noise(a){for(let i=0;i<160;i++){g.fillStyle=`rgba(255,255,255,${a*Math.random()})`;g.fillRect(Math.random()*W,Math.random()*H,20+Math.random()*90,2+Math.random()*4)}}
function P(x,y,col,hand){g.fillStyle=col;rr(x-35,y,70,110,24);g.fill();ci(x,y-28,26,"#f1c9a0");if(hand){g.fillStyle="#111";rr(x-10,y+20,20,34,4);g.fill()}}
function s1(t){bg(t);const z=t>9?Math.max(.45,1-(t-9)*.09):1;g.save();g.translate(W/2,H/2);g.scale(z,z);g.translate(-W/2,-H/2);
const k=t<7?1:Math.max(0,1-(t-7)/1.5);
if(k>0){ci(W/2,H/2,175*k,"#f4f1e8");g.strokeStyle="#222";g.lineWidth=4;for(let i=0;i<12;i++){const a=i*Math.PI/6;g.beginPath();g.moveTo(W/2+Math.cos(a)*150*k,H/2+Math.sin(a)*150*k);g.lineTo(W/2+Math.cos(a)*168*k,H/2+Math.sin(a)*168*k);g.stroke()}
const a=Math.floor(t*2)*Math.PI/8-Math.PI/2;g.strokeStyle="#d22";g.lineWidth=6;g.beginPath();g.moveTo(W/2,H/2);g.lineTo(W/2+Math.cos(a)*150*k,H/2+Math.sin(a)*150*k);g.stroke();
const f=1-(t*2%1)*4;if(f>0)ci(W/2,H/2,200,`rgba(255,255,255,${f*.35})`)}
const n=t<8?Math.floor(t*2):Math.floor(16+Math.pow(t-8,1.6)*40);
for(let i=0;i<Math.min(n,600);i++){let x,y,pop=1;if(i<16){const a=i/16*Math.PI*2-Math.PI/2;x=W/2+Math.cos(a)*250;y=H/2+Math.sin(a)*250;pop=Math.min(1,(t-i*.5)*5)}else{x=-700+R(i)*2680;y=-450+R(i+999)*1620}
tv(x,y,(i<16?1.1:.8+R(i+5)*.5)*pop,R(i+3)*360,t)}
g.restore()}
function cafe(t){g.fillStyle="#1b1230";g.fillRect(0,0,W,H);
for(let i=0;i<8;i++)for(let j=0;j<4;j++){const q=i*4+j,ch=Math.floor(t*3+R(q)*5);g.fillStyle=`hsl(${R(q+ch*13)*360},80%,${t>16.3?55:25}%)`;rr(60+i*148,40+j*92,130,76,8);g.fill()}
g.fillStyle="#2a1a10";g.fillRect(0,560,W,160);g.fillStyle="#6b4226";g.fillRect(480,470,320,18);g.fillRect(630,488,20,90);
P(620,340,"#3a6ea5");g.fillStyle="#222";g.beginPath();g.ellipse(620,318-340+340-12+12,10,t>16.3?6+5*Math.sin(t*14):2,0,0,7);g.fill();
ci(600,310,4,"#222");ci(640,310,4,"#222");ci(720,462,14,"#fff");
P(980,360,"#b33",0);g.fillStyle="#999";g.fillRect(900,440,60,6);
if(t>16.3&&t<18)T("Bir orta şekerli kahve, lütfen!",620,250,30,"#fff","center","#000");
if(t>17.5){const s=Math.min(1,(t-17.5)*4);g.fillStyle="rgba(0,0,0,.82)";g.fillRect(0,300,W,110);T("Orta Şekerli Kahve Beklerken Yapılabilecek 50 Şey TV",W/2,372,40*s,"#ff4be0","center","#ff4be0")}}
function street(t){g.fillStyle="#120d2b";g.fillRect(0,0,W,H);
for(let L=0;L<2;L++){const sp=L?160:70,off=(t*sp)%260;for(let i=-1;i<7;i++){const b=i+Math.floor(t*sp/260)+L*50,x=i*260-off;g.fillStyle=L?"#2a2150":"#1d1740";g.fillRect(x,(L?200:120)-R(b)*80,240,H);
for(let j=0;j<3;j++)for(let q=0;q<2;q++)tv(x+60+q*110,260+j*110+L*30,.6+L*.15,R(b*9+j*3+q)*360+t*80,t)}}
g.fillStyle="#222";g.fillRect(0,610,W,110);const by=Math.abs(Math.sin(t*8))*10;P(420,430-by,"#e0a030");
const k=Math.floor(t*2.5),ph=t*2.5%1;g.globalAlpha=1-ph;T("▶ Bölüm 1 · Kanal "+(8000+k*37),420,330-ph*60,28,"#6fffb0","center","#000");g.globalAlpha=1}
function metro(t){g.fillStyle="#14202e";g.fillRect(0,0,W,H);g.fillStyle="#0c141e";g.fillRect(0,300,W,420);
g.strokeStyle="rgba(255,255,255,.12)";g.lineWidth=6;for(let i=0;i<12;i++){const x=((i*140-t*500)%1700+1700)%1700-200;g.beginPath();g.moveTo(x,20);g.lineTo(x+90,20);g.stroke()}
g.fillStyle="#000";rr(60,60,360,220,12);g.fill();g.save();g.translate(240,150);g.rotate(t*2);g.strokeStyle="#9bf";g.lineWidth=5;g.beginPath();g.arc(0,0,40,0,5);g.stroke();g.restore();T("EVRENİN SONU",240,230,28,"#fff");T("TARTIŞMASI · CANLI",240,262,18,"#f55");
g.fillStyle="#000";rr(860,60,360,220,12);g.fill();const cx=1040,cy=165,yw=Math.max(0,Math.sin(t*1.5));
ci(cx-40,cy-50,22,"#ff9a2e");ci(cx+40,cy-50,22,"#ff9a2e");ci(cx,cy,62,"#ff9a2e");g.strokeStyle="#c60";g.lineWidth=5;g.beginPath();g.moveTo(cx-30,cy-35);g.lineTo(cx-18,cy-20);g.moveTo(cx+30,cy-35);g.lineTo(cx+18,cy-20);g.stroke();
g.fillStyle="#511";g.beginPath();g.ellipse(cx,cy+25,16,4+22*yw,0,0,7);g.fill();T("● CANLI",1160,100,16,"#f44");T("Turuncu Kedi Esniyor",1040,262,22,"#fff");
for(let i=0;i<6;i++){const x=150+i*195;P(x,380,`hsl(${i*55},45%,45%)`,1);g.strokeStyle=`hsl(${R(i+Math.floor(t*2.5))*360},100%,65%)`;g.lineWidth=3;g.shadowColor=g.strokeStyle;g.shadowBlur=14;rr(x-45,300+Math.sin(t*3+i)*6,90,55,8);g.stroke();g.shadowBlur=0}
if(t>31){g.fillStyle="#fff";rr(430,250,420,56,18);g.fill();T("14.203 numaralı kanaldayım, beni oradan izle",640,286,21,"#111")}}
function s3(t){g.fillStyle="#5a5c60";g.fillRect(0,0,W,H);noise(.06);
g.fillStyle="#3b4552";rr(400,520,480,260,80);g.fill();ci(640,330,135,"#d9b99b");g.fillStyle="#2a2018";g.beginPath();g.ellipse(640,228,125,48,0,Math.PI,0);g.fill();
g.fillStyle="#111";g.beginPath();g.ellipse(592,330,10,13,0,0,7);g.ellipse(688,330,10,13,0,0,7);g.fill();
g.strokeStyle="#321";g.lineWidth=6;g.beginPath();g.moveTo(560,300);g.lineTo(615,290);g.moveTo(720,300);g.lineTo(665,290);g.moveTo(600,415);g.quadraticCurveTo(640,400,680,415);g.stroke();
const p=(t%2.5)/2.5;g.globalAlpha=1-p*p*p;ci(690,350+260*p*p,9,"#8cf");g.globalAlpha=1;
g.fillStyle="rgba(0,0,0,.7)";g.fillRect(0,630,W,60);T("Kanal 50.412 – Sadece Gri Fon ve Ağlayan Adam",W/2,672,30);
const v=Math.min(3,1+Math.max(0,t-35.6)/14.4*2);g.fillStyle="rgba(0,0,0,.65)";rr(900,30,350,70,10);g.fill();T("İZLEYİCİ  "+v.toFixed(1).replace(".",",")+" Milyar",1075,76,26,"#ff6","center");T("● CANLI",110,70,26,"#f44");T("14:12",1180,140,22,"#ddd");
if(t<35.6){g.fillStyle=`rgba(0,0,0,${1-(t-35)/.6})`;g.fillRect(0,0,W,H)}}
function s4(t){g.fillStyle="#04030a";g.fillRect(0,0,W,H);
if(t<55){const z=3-(t-50)*.44;g.save();g.translate(W/2,H/2);g.scale(z,z);const gr=g.createRadialGradient(-20,-20,5,0,0,80);gr.addColorStop(0,"#5cf");gr.addColorStop(1,"#135");ci(0,0,80,gr);ci(-25,10,22,"#3a6");
for(let i=0;i<60;i++){g.save();g.rotate(R(i)*3.14+t*(R(i+7)-.5)*.5);g.strokeStyle=R(i+2)>.5?"rgba(190,90,255,.7)":"rgba(70,255,160,.7)";g.lineWidth=1.5;g.beginPath();g.ellipse(0,0,110+R(i+1)*90,100+R(i+3)*70,0,0,7);g.stroke();g.restore()}
g.strokeStyle="#ddd";g.lineWidth=2;for(let i=0;i<14;i++){const a=i/14*6.28;g.beginPath();g.moveTo(Math.cos(a)*82,Math.sin(a)*82);g.lineTo(Math.cos(a)*110,Math.sin(a)*110);g.stroke();ci(Math.cos(a)*112,Math.sin(a)*112,3,"#ff4be0")}g.restore();
if(t>54){g.fillStyle=`rgba(4,3,10,${t-54})`;g.fillRect(0,0,W,H)}}
if(t>=54.8&&t<57){g.globalAlpha=Math.min(1,(t-54.8)*3);g.save();g.translate(W/2,H/2);g.fillStyle="#222";rr(-70,-190,140,380,34);g.fill();ci(0,-140,20,t>56.3?"#f66":"#a22");
for(let i=0;i<9;i++)ci(-40+(i%3)*40,-70+Math.floor(i/3)*55,14,`hsl(${i*40},60%,45%)`);
const fy=520-Math.min(1,Math.max(0,(t-55.3)/1))*(520-(-140))-(t>56.3?-6:0);g.fillStyle="#f1c9a0";rr(-18,fy,36,300,18);g.fill();g.restore();g.globalAlpha=1}
if(t>=57){const n=Math.floor((t-57)*16);T("Saniye: 86.401...".slice(0,n),W/2,330,72,"#fff","center","#6fffb0");T("Yeni kanal yükleniyor.".slice(0,Math.max(0,n-17)),W/2,410,36,"#ff4be0","center","#ff4be0");noise(t>59?.8:.2)}}
function draw(t){if(t<15)s1(t);else if(t<21)cafe(t);else if(t<26)street(t);else if(t<35)metro(t);else if(t<50)s3(t);else s4(t);
for(const b of[15,21,26,35,50])if(t>b&&t<b+.25)noise(.9);
g.fillStyle="rgba(0,0,0,.1)";for(let y=0;y<H;y+=4)g.fillRect(0,y,W,1)}
const b=document.getElementById("b"),r=document.getElementById("r"),tm=document.getElementById("tm"),m=document.getElementById("m"),sub=document.getElementById("sub");
function toggle(){if(t>=60){t=0;lc=-1}playing=!playing;b.textContent=playing?"⏸ Duraklat":"▶ Oynat";if(!playing&&window.speechSynthesis)speechSynthesis.cancel();else lc=-1}
b.onclick=toggle;c.onclick=toggle;
r.oninput=()=>{t=+r.value;lc=-1;if(window.speechSynthesis)speechSynthesis.cancel()};
function f(n){if(playing){t+=Math.min(.1,(n-last)/1000);if(t>=60){t=60;playing=false;b.textContent="↻ Tekrar"}}last=n;
const i=cues.findIndex(q=>t>=q[0]&&t<q[1]);if(i!==lc){lc=i;sub.textContent=i>=0?cues[i][2]:"";if(i>=0&&playing)say(cues[i][2])}
draw(t);r.value=t;const s=Math.floor(t);tm.textContent=`0:${String(s).padStart(2,"0")} / 1:00`;requestAnimationFrame(f)}
requestAnimationFrame(f);
</script></body></html>
